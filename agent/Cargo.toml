[package]
name = "gamepulse-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
sysinfo = { version = "0.39.5" }
gfxinfo = { version = "0.1.2", default-features = true }

tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
native-tls = "0.2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
url = "2"
anyhow = "1.0.103"