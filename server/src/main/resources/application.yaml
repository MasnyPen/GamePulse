spring:
  datasource:
    url: ${PSQL_URI}
    username: ${PSQL_USER}
    password: ${PSQL_PASS}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  auth_token: ${GAMEPULSE_AUTH_TOKEN:token}
  old_snapshots_threshold: ${GAMEPULSE_OLD_SNAPSHOTS_THRESHOLD:1d}