services:
  postgres:
    image: postgres:16
    container_name: gamepulse-postgres

    environment:
      POSTGRES_DB: gamepulse
      POSTGRES_USER: gamepulse
      POSTGRES_PASSWORD: gamepulse

    ports:
      - "5432:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gamepulse -d gamepulse" ]
      interval: 10s
      timeout: 5s
      retries: 5

    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9

volumes:
  pg_data:
